# Plane Community Edition v1.4.3 para EasyPanel.
# Basado en el docker-compose.yml oficial de la release (upstream/docker-compose.yml) con estos cambios:
#  - Sin `ports` ni `container_name` (EasyPanel los prohibe): el dominio y el HTTPS los pone EasyPanel,
#    que enruta al servicio `proxy`, puerto 80.
#  - DATABASE_URL y AMQP_URL se construyen con las contraseñas (en el oficial quedaban en plane:plane).
#  - TRUSTED_PROXIES llega al proxy (en el oficial no llegaba y se podia falsear X-Forwarded-For).
#  - Parche de adjuntos de texto (makeplane/plane#10128) montado en la API.
#  - Los secretos son obligatorios: si falta alguno, el despliegue se para con un mensaje.
#  - Servicio `time` (módulo de tiempo, carpeta time/) y ruta /time/ en el proxy (proxy/Caddyfile).

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: plane
  POSTGRES_USER: plane
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}
  POSTGRES_DB: plane
  POSTGRES_PORT: 5432
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Falta AWS_ACCESS_KEY_ID en el .env}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Falta AWS_SECRET_ACCESS_KEY en el .env}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:?Falta APP_DOMAIN en el .env}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  BUCKET_NAME: uploads
  # Caddy solo escucha en :80 dentro de la red; el certificado lo gestiona EasyPanel.
  SITE_ADDRESS: ":80"
  CERT_EMAIL: ""
  CERT_ACME_CA: https://acme-v02.api.letsencrypt.org/directory
  CERT_ACME_DNS: ""
  LISTEN_HTTP_PORT: 80
  LISTEN_HTTPS_PORT: 443

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_DEFAULT_USER: plane
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en el .env}
  RABBITMQ_DEFAULT_VHOST: plane
  RABBITMQ_VHOST: plane

x-live-env: &live-env
  API_BASE_URL: http://api:8000
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?Falta LIVE_SERVER_SECRET_KEY en el .env}

x-app-env: &app-env
  WEB_URL: https://${APP_DOMAIN}
  CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
  DEBUG: 0
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
  USE_MINIO: 1
  # El navegador sube a https://dominio/uploads: las URLs firmadas deben ser https.
  MINIO_ENDPOINT_SSL: 1
  DATABASE_URL: postgresql://plane:${POSTGRES_PASSWORD}@plane-db:5432/plane
  SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en el .env}
  AMQP_URL: amqp://plane:${RABBITMQ_PASSWORD}@plane-mq:5672/plane
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

services:
  web:
    image: makeplane/plane-frontend:v1.4.3
    restart: always
    depends_on: [api, worker]
    volumes:
      # Módulo de tiempo dentro de Plane: el script añade su <script> al index.html al arrancar
      - ./time/plane-web/40-time-embed.sh:/docker-entrypoint.d/40-time-embed.sh:ro

  space:
    image: makeplane/plane-space:v1.4.3
    restart: always
    depends_on: [api, worker, web]

  admin:
    image: makeplane/plane-admin:v1.4.3
    restart: always
    depends_on: [api, web]

  live:
    image: makeplane/plane-live:v1.4.3
    restart: always
    environment:
      <<: [*live-env, *redis-env]
    depends_on: [api, web]

  api:
    image: makeplane/plane-backend:v1.4.3
    command: ./bin/docker-entrypoint-api.sh
    restart: always
    volumes:
      - logs_api:/code/plane/logs
      # Adjuntos .txt/.md/.csv/.json rechazados (makeplane/plane#10128). Quitar cuando
      # la release incluya makeplane/plane#10167.
      - ./patches/attachment.py:/code/plane/app/views/issue/attachment.py:ro
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [plane-db, plane-redis, plane-mq]

  worker:
    image: makeplane/plane-backend:v1.4.3
    command: ./bin/docker-entrypoint-worker.sh
    restart: always
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [api, plane-db, plane-redis, plane-mq]

  beat-worker:
    image: makeplane/plane-backend:v1.4.3
    command: ./bin/docker-entrypoint-beat.sh
    restart: always
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [api, plane-db, plane-redis, plane-mq]

  migrator:
    image: makeplane/plane-backend:v1.4.3
    command: ./bin/docker-entrypoint-migrator.sh
    restart: on-failure
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [plane-db, plane-redis]

  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    restart: always
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /export --console-address ":9090"
    restart: always
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  # Módulo de tiempo (carpeta time/): reloj, hoja de horas, carga de trabajo e informes.
  # Se sirve en https://<dominio>/time/ a través del proxy y usa la sesión de Plane.
  time:
    build: ./time
    image: plane-time:local
    restart: always
    environment:
      DATABASE_URL: postgresql://plane:${POSTGRES_PASSWORD}@plane-db:5432/plane
      PLANE_API_URL: http://api:8000
      APP_ORIGIN: https://${APP_DOMAIN}
    depends_on: [plane-db, api]

  # Punto de entrada: en EasyPanel, el dominio apunta a este servicio, puerto 80.
  proxy:
    image: makeplane/plane-proxy:v1.4.3
    restart: always
    environment:
      <<: *proxy-env
      # Proxies cuyo X-Forwarded-For se acepta: la red interna de Docker, donde vive el
      # Traefik de EasyPanel. Nunca 0.0.0.0/0.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    volumes:
      - proxy_config:/config
      - proxy_data:/data
      # Caddyfile oficial (upstream/Caddyfile) más la ruta /time/ del módulo de tiempo
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [web, api, space, admin, live, time]

volumes:
  pgdata:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:
